<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guppy Market Splash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #FFFFFF;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text-container {
            text-align: center;
            color: #1C1C1C;
            margin-top: -10px;
        }
        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #225741;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #555555;
            font-weight: 500;
        }
        .loading-bar-container {
            width: 180px;
            height: 4px;
            background: #EEEEEE;
            border-radius: 2px;
            margin: 32px auto 0;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-progress {
            width: 100%;
            height: 100%;
            background: #4CAF50;
            border-radius: 2px;
            animation: loadingProgress 2.2s ease-in-out infinite;
            transform-origin: left;
        }
        @keyframes loadingProgress {
            0% { transform: scaleX(0); }
            50% { transform: scaleX(0.7); }
            100% { transform: scaleX(1); }
        }
    </style>
    <!-- Three.js CDN Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="text-container">
        <div class="title">Guppy Market</div>
        <div class="subtitle">Aplikasi Lelang & Jual Beli Guppy</div>
        <div class="loading-bar-container">
            <div class="loading-bar-progress"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        // Renderer (Transparent Background for White Theme)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xFFFFFF, 1.5, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4CAF50, 1.2, 50);
        pointLight2.position.set(-5, -5, 2);
        scene.add(pointLight2);

        // 3D Object Group
        const group = new THREE.Group();

        // Torus / Fish-like Water Ring Shape
        const geometry = new THREE.TorusGeometry(1.2, 0.4, 16, 100);
        const material = new THREE.MeshPhongMaterial({
            color: 0x4CAF50,
            emissive: 0x113322,
            specular: 0xFFFFFF,
            shininess: 100,
            flatShading: false,
            wireframe: false
        });
        const mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);

        // Inner Sphere (Pearl / Gem)
        const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xFFCA28,
            roughness: 0.1,
            metalness: 0.8
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh);

        scene.add(group);

        // Particles System (Water Bubbles)
        const particlesGeo = new THREE.BufferGeometry();
        const count = 40;
        const positions = new Float32Array(count * 3);

        for(let i=0; i<count*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 6;
            positions[i+1] = (Math.random() - 0.5) * 6;
            positions[i+2] = (Math.random() - 0.5) * 6;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({
            color: 0x4CAF50,
            size: 0.08,
            transparent: true,
            opacity: 0.4
        });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);

        // Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate main ring
            mesh.rotation.y = elapsedTime * 0.8;
            mesh.rotation.x = Math.sin(elapsedTime * 0.5) * 0.5;

            // Inner core gentle rotation
            coreMesh.rotation.y = -elapsedTime * 0.5;

            // Floating movement
            group.position.y = Math.sin(elapsedTime * 2.0) * 0.15;

            // Water bubbles moving up slowly
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i=1; i<count*3; i+=3) {
                positions[i] += 0.01;
                if(positions[i] > 3) positions[i] = -3;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            particleSystem.rotation.y = elapsedTime * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
