<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guppy Market Splash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #2E6F54 0%, #173E2E 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text-container {
            text-align: center;
            color: #FFFFFF;
            margin-top: -20px;
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #FFFFFF;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 13px;
            color: #E7F3EE;
            opacity: 0.8;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
        .loading-bar-container {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 24px auto 0;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-progress {
            width: 100%;
            height: 100%;
            background: #FFCA28;
            border-radius: 2px;
            animation: loadingProgress 2.8s ease-in-out infinite;
            transform-origin: left;
        }
        @keyframes loadingProgress {
            0% { transform: scaleX(0); }
            50% { transform: scaleX(0.7); }
            100% { transform: scaleX(1); }
        }
    </style>
    <!-- Three.js CDN Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="text-container">
        <div class="title">Guppy Market IDN</div>
        <div class="subtitle">Platform Lelang & Jual Beli Guppy Terpercaya</div>
        <div class="loading-bar-container">
            <div class="loading-bar-progress"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xFFCA28, 2, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4CAF50, 1.5, 50);
        pointLight2.position.set(-5, -5, 2);
        scene.add(pointLight2);

        // 3D Object Group (Floating Badge)
        const group = new THREE.Group();

        // Outer Ring / Diamond Shape
        const geometry = new THREE.IcosahedronGeometry(1.2, 1);
        const material = new THREE.MeshPhongMaterial({
            color: 0x225741,
            emissive: 0x0f2b1f,
            specular: 0xFFCA28,
            shininess: 90,
            flatShading: true,
            wireframe: false
        });
        const mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);

        // Inner Core (Gold Star / Gem)
        const coreGeo = new THREE.OctahedronGeometry(0.65, 0);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xFFCA28,
            roughness: 0.2,
            metalness: 0.8
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh);

        // Outer Wireframe Halo
        const haloGeo = new THREE.IcosahedronGeometry(1.6, 1);
        const haloMat = new THREE.MeshBasicMaterial({
            color: 0xFFCA28,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        group.add(haloMesh);

        scene.add(group);

        // Particles System
        const particlesGeo = new THREE.BufferGeometry();
        const count = 60;
        const positions = new Float32Array(count * 3);

        for(let i=0; i<count*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 8;
            positions[i+1] = (Math.random() - 0.5) * 8;
            positions[i+2] = (Math.random() - 0.5) * 8;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({
            color: 0xFFCA28,
            size: 0.05,
            transparent: true,
            opacity: 0.6
        });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);

        // Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate group
            group.rotation.y = elapsedTime * 0.8;
            group.rotation.x = Math.sin(elapsedTime * 0.5) * 0.3;

            // Inner core counter rotation
            coreMesh.rotation.y = -elapsedTime * 1.2;
            coreMesh.rotation.z = elapsedTime * 0.6;

            // Halo pulse
            haloMesh.rotation.y = -elapsedTime * 0.3;

            // Floating movement
            group.position.y = Math.sin(elapsedTime * 1.5) * 0.15;

            // Particles slow rotation
            particleSystem.rotation.y = elapsedTime * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
